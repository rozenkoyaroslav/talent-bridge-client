name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployments must not overlap, but a queued one should not cancel a running
# one either — the site would be left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The lock file is generated on macOS, and npm prunes optional binaries that do
      # not match that platform (npm/cli#4828). package.json declares the Linux
      # bundler bindings explicitly so they survive in the lock and `npm ci` produces
      # a tree this runner can build with.
      - run: npm ci

      # A project site is served from /<repo>/, so the bundle has to know its base.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_MODE: mock

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
