name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The lock file is generated on macOS, and npm prunes optional binaries that do
      # not match that platform (npm/cli#4828). package.json declares the Linux
      # bundler bindings explicitly so they survive in the lock and `npm ci` produces
      # a tree this runner can build with.
      - run: npm ci

      - run: npm run build

      - run: npm test

      # The demo runs entirely in the browser, so the only meaningful end-to-end
      # check is driving the built bundle with a real one.
      - run: npx playwright install --with-deps chromium

      - name: Serve the built demo and drive it
        run: |
          npm run preview &
          npx --yes wait-on http://localhost:4173 --timeout 60000
          npm run e2e
