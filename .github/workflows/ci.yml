name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm prunes optional platform binaries that do not match the machine the
      # lock file was generated on (npm/cli#4828), so a macOS-generated lock has no
      # Linux rolldown/lightningcss binding and `npm ci` produces a tree that cannot
      # build here. `npm install` resolves the binding for this platform while still
      # honouring the locked versions of everything else.
      - run: npm install --no-audit --no-fund

      - run: npm run build

      - run: npm test

      # The demo runs entirely in the browser, so the only meaningful end-to-end
      # check is driving the built bundle with a real one.
      - run: npx playwright install --with-deps chromium

      - name: Serve the built demo and drive it
        run: |
          npm run preview &
          npx --yes wait-on http://localhost:4173 --timeout 60000
          npm run e2e
